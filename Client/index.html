<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="jl2hxmLiH1FYTwgQQkCoXlO4_Udmo0xXOMIuvD_UC5Q" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>G1Card - Unified Medical Records</title>
    <meta name="description" content="G1Card keeps a patient's medical records from every hospital in one place. Hospitals ask for access, patients approve it, and every view is logged." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/index.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #ece8e1;
      }
      .dark body {
        background-color: #10141a;
      }
      /* Smooth transitions for all elements */
      * {
        transition: background-color 0.2s ease-in-out, color 0.2s ease-in-out, border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200">
    <script>
      // On page load or when changing themes, best to add inline in `head` to avoid FOUC
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      } else {
        document.documentElement.classList.remove('dark')
      }
    </script>
    <script>
      // Provide a stable global notify binding before modules execute.
      window.notify = window.notify || function(message) {
        const text = typeof message === 'string' ? message : String(message ?? '');
        window.dispatchEvent(new CustomEvent('g1card:notify', {
          detail: { title: 'Notice', message: text, type: 'info' }
        }));
      };
      var notify = function(message) {
        return window.notify(message);
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
